[project]
name = "yoto-mcp"
version = "0.1.0"
description = "Local MCP server for Yoto MYO playlists and interactive cards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",  # 2.x renames FastMCP to MCPServer; migrate deliberately
    "httpx>=0.27",
    "keyring>=25",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yoto-mcp = "yoto_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long lines left are tool descriptions
